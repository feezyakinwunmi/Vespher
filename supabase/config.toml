# Edge function settings. verify_jwt = true makes the Supabase gateway reject requests
# without a valid project JWT (user session or anon key). Functions that move money
# additionally resolve the signed-in user themselves (see _shared/http.ts).

[functions.verify-bank]
enabled = true
verify_jwt = true
entrypoint = "./functions/verify-bank/index.ts"



[functions.verify-payment]
enabled = true
verify_jwt = true
entrypoint = "./functions/verify-payment/index.ts"

[functions.process-refund]
enabled = true
verify_jwt = true
entrypoint = "./functions/process-refund/index.ts"

[functions.delete-account]
enabled = true
verify_jwt = true
entrypoint = "./functions/delete-account/index.ts"

[functions.suggest-dish-info]
enabled = true
verify_jwt = true
entrypoint = "./functions/suggest-dish-info/index.ts"

[functions.setup-subaccount]
enabled = true
verify_jwt = true
entrypoint = "./functions/setup-subaccount/index.ts"

[functions.init-payment]
enabled = true
verify_jwt = true
entrypoint = "./functions/init-payment/index.ts"
